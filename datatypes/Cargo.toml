[package]
name = "datatypes"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
gated-derive = { path = "../macro-gated-derive" }
serde = { version = "1.0.228", features = [
    "derive",
], default-features = false, optional = true }
bincode = { version = "2.0.1", features = [
    "derive",
    "serde",
], default-features = false, optional = true }
defmt = { version = "1.0.1", optional = true }
arbitrary = { version = "1.4.1", features = ["derive"], optional = true }


[features]
std = ["bincode/std"]
derive_serde = ["dep:serde"]
derive_defmt = ["dep:defmt"]
derive_bincode = ["dep:bincode"]
derive_arbitrary = ["dep:arbitrary", "std"]
