[package]
name = "messages"
version = "0.3.0"
edition = "2024"

[dependencies]
dp-engine-control-board = { version = "0.3.0", path = "../datapoints/dp-engine-control-board" }
dp-fuel-control-board = { version = "0.3.0", path = "../datapoints/dp-fuel-control-board" }
dp-power-board = { version = "0.3.0", path = "../datapoints/dp-power-board" }
dp-rfs-computer = { version = "0.3.0", path = "../datapoints/dp-rfs-computer" }
dp-system-management = { version = "0.3.0", path = "../datapoints/dp-system-management" }
dp-flight-computer = { version = "0.3.0", path = "../datapoints/dp-flight-computer" }
dp-oxidizer-control-board = { version = "0.3.0", path = "../datapoints/dp-oxidizer-control-board" }
dp-recovery-board = { version = "0.3.0", path = "../datapoints/dp-recovery-board" }
dp-sensor-carrier = { version = "0.3.0", path = "../datapoints/dp-sensor-carrier" }

data-core = { version = "0.1.0", path = "../core" }
gated-derive = { path = "../macro-gated-derive" }
thiserror = { version = "2.0.17", optional = true, default-features = false }
utoipa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
default = ["can", "mavlink"]
can = [
    "derive_can",
    "dp-engine-control-board/can",
    "dp-fuel-control-board/can",
    "dp-power-board/can",
    "dp-rfs-computer/can",
    "dp-system-management/can",
    "dp-flight-computer/can",
    "dp-oxidizer-control-board/can",
    "dp-recovery-board/can",
    "dp-sensor-carrier/can",
    "data-core/can",
    "dep:thiserror",                 # required for CAN message macro
]
mavlink = [
    "derive_mavlink",
    "dp-engine-control-board/mavlink",
    "dp-fuel-control-board/mavlink",
    "dp-power-board/mavlink",
    "dp-rfs-computer/mavlink",
    "dp-system-management/mavlink",
    "dp-flight-computer/mavlink",
    "dp-oxidizer-control-board/mavlink",
    "dp-recovery-board/mavlink",
    "dp-sensor-carrier/mavlink",
    "data-core/mavlink",
]
mission-control = [
    "dp-engine-control-board/mission-control",
    "dp-fuel-control-board/mission-control",
    "dp-power-board/mission-control",
    "dp-rfs-computer/mission-control",
    "dp-system-management/mission-control",
    "dp-flight-computer/mission-control",
    "dp-oxidizer-control-board/mission-control",
    "dp-recovery-board/mission-control",
    "dp-sensor-carrier/mission-control",
    "derive_utoipa",
    "derive_serde"
]
derive_serde = ["dep:serde"]
derive_utoipa = ["dep:utoipa"]
derive_can = []
derive_mavlink = []
derive_debug = []

[lints]
workspace = true
