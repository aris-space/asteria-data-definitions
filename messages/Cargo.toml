[package]
name = "messages"
version = "0.4.0"
edition = "2024"

[dependencies]
dp-engine-control-board = { version = "0.3.0", path = "../datapoints/dp-engine-control-board" }
dp-fuel-control-board = { version = "0.4.0", path = "../datapoints/dp-fuel-control-board" }
dp-power-board = { version = "0.3.0", path = "../datapoints/dp-power-board" }
dp-rfs-computer = { version = "0.3.0", path = "../datapoints/dp-rfs-computer" }
dp-system-management = { version = "0.3.0", path = "../datapoints/dp-system-management" }
dp-flight-computer = { version = "0.3.0", path = "../datapoints/dp-flight-computer" }
dp-oxidizer-control-board = { version = "0.4.0", path = "../datapoints/dp-oxidizer-control-board" }
dp-recovery-board = { version = "0.3.0", path = "../datapoints/dp-recovery-board" }
dp-sensor-carrier = { version = "0.3.0", path = "../datapoints/dp-sensor-carrier" }

data-core = { version = "0.1.0", path = "../core" }
gated-derive = { path = "../macro-gated-derive" }
thiserror = { version = "2.0.17", optional = true, default-features = false }
utoipa = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
default = ["can"]
# Derive can related traits for all datapoints and datapoint specific types
can = [
    "derive_can",
    "derive_bincode",
    "dp-engine-control-board/can",
    "dp-fuel-control-board/can",
    "dp-power-board/can",
    "dp-rfs-computer/can",
    "dp-system-management/can",
    "dp-flight-computer/can",
    "dp-oxidizer-control-board/can",
    "dp-recovery-board/can",
    "dp-sensor-carrier/can",
    "data-core/can",
    "dep:thiserror",                 # required for CAN message macro
]
# Derive pss related traits for all datapoints and datapoint specific types
pss = [
    "derive_pss",
    "dp-engine-control-board/pss",
    "dp-fuel-control-board/pss",
    # "dp-power-board/pss",
    "dp-rfs-computer/pss",
    # "dp-system-management/pss",
    # "dp-flight-computer/pss",
    "dp-oxidizer-control-board/pss",
    # "dp-recovery-board/pss",
    # "dp-sensor-carrier/pss",
    "data-core/pss",
]
# Derive serde for all datapoint specific types
derive_serde = [
    "dp-engine-control-board/derive_serde",
    "dp-fuel-control-board/derive_serde",
    "dp-power-board/derive_serde",
    "dp-rfs-computer/derive_serde",
    "dp-system-management/derive_serde",
    "dp-flight-computer/derive_serde",
    "dp-oxidizer-control-board/derive_serde",
    "dp-recovery-board/derive_serde",
    "dp-sensor-carrier/derive_serde",
    "dep:serde",
]
# Derive defmt for all datapoint specific types
derive_defmt = [
    "dp-engine-control-board/derive_defmt",
    "dp-fuel-control-board/derive_defmt",
    # "dp-power-board/derive_defmt",
    "dp-rfs-computer/derive_defmt",
    # "dp-system-management/derive_defmt",
    "dp-flight-computer/derive_defmt",
    "dp-oxidizer-control-board/derive_defmt",
    "dp-recovery-board/derive_defmt",
    "dp-sensor-carrier/derive_defmt",
]
# Derive arbitrary for all datapoint specific types
derive_arbitrary = [
    "dp-engine-control-board/derive_arbitrary",
    "dp-fuel-control-board/derive_arbitrary",
    # "dp-power-board/derive_arbitrary",
    "dp-rfs-computer/derive_arbitrary",
    # "dp-system-management/derive_arbitrary",
    "dp-flight-computer/derive_arbitrary",
    "dp-oxidizer-control-board/derive_arbitrary",
    "dp-recovery-board/derive_arbitrary",
    "dp-sensor-carrier/derive_arbitrary",
]
# Derive Debug for the message enum, all datapoints and datapoint specific types
derive_debug = [
    "dp-engine-control-board/derive_debug",
    "dp-fuel-control-board/derive_debug",
    "dp-power-board/derive_debug",
    "dp-rfs-computer/derive_debug",
    "dp-system-management/derive_debug",
    "dp-flight-computer/derive_debug",
    "dp-oxidizer-control-board/derive_debug",
    "dp-recovery-board/derive_debug",
    "dp-sensor-carrier/derive_debug",
]
# Derive the Utoipa and Serde for the message enum and all dependencies.
mavlink = [
    "derive_mavlink",
    "dp-engine-control-board/mavlink",
    "dp-fuel-control-board/mavlink",
    "dp-power-board/mavlink",
    "dp-rfs-computer/mavlink",
    "dp-system-management/mavlink",
    "dp-flight-computer/mavlink",
    "dp-oxidizer-control-board/mavlink",
    "dp-recovery-board/mavlink",
    "dp-sensor-carrier/mavlink",
    "data-core/mavlink",
]
# Derive the Mission Control related features for the message enum and all dependencies.
mission-control = [
    "dp-engine-control-board/mission-control",
    "dp-fuel-control-board/mission-control",
    "dp-power-board/mission-control",
    "dp-rfs-computer/mission-control",
    "dp-system-management/mission-control",
    "dp-flight-computer/mission-control",
    "dp-oxidizer-control-board/mission-control",
    "dp-recovery-board/mission-control",
    "dp-sensor-carrier/mission-control",
    "derive_utoipa",
    "derive_serde",
]
# Derive the Utoipa API schema generation for the message enum and all dependencies.
derive_utoipa = [
    "dp-engine-control-board/derive_utoipa",
    "dp-fuel-control-board/derive_utoipa",
    "dp-power-board/derive_utoipa",
    "dp-rfs-computer/derive_utoipa",
    "dp-system-management/derive_utoipa",
    "dp-flight-computer/derive_utoipa",
    "dp-oxidizer-control-board/derive_utoipa",
    "dp-recovery-board/derive_utoipa",
    "dp-sensor-carrier/derive_utoipa",
    "dep:utoipa",
]
derive_can = []
derive_mavlink = []
derive_bincode = []
derive_pss = []

[lints]
workspace = true
