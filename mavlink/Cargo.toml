[package]
name = "hermes-mavlink"
version = "0.1.0"
edition = "2021"
description = "Implements the MAVLink messages for the Hermes project."
authors = ["Louis Schell <louis.schell1@gmx.de>"]

[dependencies]
# Dependencies for mavlink-bingen generated code.
num-derive = "0.4.2"
num-traits = "0.2.19"
bitflags = { version = "2.8.0" }
mavlink-core = { version = "0.13.1" }
serde = { version = "1.0.218", optional = true }
serde_arrays = { version = "0.1.0", optional = true }

[build-dependencies]
mavlink-bindgen = "=0.13.1"

[features]
# HERMES MAVLink dialect enabled by default
default = ["hermes"]

# Implements serde traits for generated messages
serde = ["dep:serde", "dep:serde_arrays", "mavlink-core/serde"]

# Enables the HERMES MAVLink dialect
hermes = []

# Enables an example MAVLink dialect used for testing and development
examples = []

[[example]]
name = "encode_decode"
required-features = ["examples"]

[[example]]
name = "send_receive"
required-features = ["examples"]
