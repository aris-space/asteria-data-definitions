[package]
name = "dp-engine-control-board"
version = "0.3.0"
edition = "2024"

[dependencies]
datatypes = { version = "0.1.0", path = "../../datatypes" }
data-core = { version = "0.1.0", path = "../../core", features = ["can"] }
bincode = "2.0.1"
serde = { version = "1", optional = true, features = ["derive"] }
arbitrary = { version = "1", optional = true, features = ["derive"] }
defmt = { version = "0.3", optional = true }


[features]
std = ["bincode/std"]
serde = ["dep:serde"]
arbitrary = ["dep:arbitrary", "std"]
defmt = ["dep:defmt"]


[lints]
workspace = true
