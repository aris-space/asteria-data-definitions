[package]
name = "dp-system-management"
version = "0.3.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
datatypes = { version = "0.1.0", path = "../../datatypes" }
data-core = { version = "0.1.0", path = "../../core" }
gated-derive = { path = "../../macro-gated-derive" }

# for types:
serde = { version = "1.0.228", features = ["derive"], default-features = false, optional = true }
bincode = { version = "2.0.1", features = [
    "derive",
    "serde",
], default-features = false, optional = true }
defmt = { version = "1.0.1", optional = true }
arbitrary = { version = "1.4.1", features = ["derive"], optional = true }

[features]
can = ["derive_bincode", "data-core/can"]
std = ["bincode/std", "datatypes/std"]
derive_serde = ["dep:serde", "datatypes/derive_serde"]
derive_defmt = ["dep:defmt", "datatypes/derive_defmt"]
derive_bincode = ["dep:bincode", "datatypes/derive_bincode"]
derive_arbitrary = ["dep:arbitrary", "datatypes/derive_arbitrary", "std"]
