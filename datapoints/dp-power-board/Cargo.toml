[package]
name = "dp-power-board"
version = "0.3.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
datatypes = { version = "0.1.0", path = "../../datatypes" }
data-core = { version = "0.1.0", path = "../../core" }
gated-derive = { path = "../../macro-gated-derive" }

[features]
can = ["data-core/can", "datatypes/derive_bincode"]
std = ["datatypes/std", "data-core/std"]
derive_serde = ["datatypes/derive_serde"]
derive_defmt = ["datatypes/derive_defmt"]
