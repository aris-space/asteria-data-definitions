[package]
name = "dp-flight-computer"
version = "0.3.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
datatypes = { version = "0.1.0", path = "../../datatypes" }
data-core = { version = "0.1.0", path = "../../core" }
gated-derive = { path = "../../macro-gated-derive" }

# for types:
serde = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
arbitrary = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[features]
can = ["derive_can", "derive_bincode", "data-core/can"]
mavlink = ["derive_mavlink", "data-core/mavlink", "datatypes/derive_mavlink"]
std = ["bincode/std", "datatypes/std", "data-core/std"]
mission-control = ["derive_serde", "derive_utoipa"]
derive_serde = ["dep:serde", "datatypes/derive_serde"]
derive_defmt = ["dep:defmt", "datatypes/derive_defmt"]
derive_bincode = ["dep:bincode", "datatypes/derive_bincode"]
derive_arbitrary = ["dep:arbitrary", "datatypes/derive_arbitrary", "std"]
derive_utoipa = ["dep:utoipa", "datatypes/derive_utoipa", "std"]
derive_can = []
derive_mavlink = []
derive_debug = []
