[package]
name = "data-macros"
version = "0.1.0"
edition = "2024"

[lib]
name = "data_macros"
path = "src/lib.rs"
proc-macro = true

[features]
default = []
# Enable all CAN related macros
can = []
# Enable all MavLink related macros
mavlink = []
# Enable all PSS related macros
pss = []

[dependencies]
darling = "0.21.3"
proc-macro2 = "1.0.103"
quote = "1.0.42"
stringcase = "0.4.0"
syn = { version = "2.0.111", features = ["extra-traits"] }

[lints]
workspace = true
