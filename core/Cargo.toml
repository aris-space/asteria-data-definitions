[package]
name = "data-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", default-features = false, optional = true }
can-hal = { path = "../can-hal", version = "0.1.0", optional = true }
data-macros = { path = "../macros", version = "0.1.0" }
datapoint-information = { path = "../datapoint-information", version = "0.1.0", optional = true }
mavio = { version = "0.5.10", features = ["derive", "std"], optional = true }
mavlink-hal = { path = "../mavlink-hal", version = "0.1.0", optional = true }

[features]
default = []
bincode = ["dep:bincode"]
# Reexport all CAN related macros from the `data_macros` crate.
# Additionally, also reexport the `can_hal` and `bincode` crates which are used by those macros.
can = ["bincode", "data-macros/can", "dep:can-hal"]
datapoint-information = ["dep:datapoint-information"]
# Reexport all MavLink related macros from the `data_macros` crate.
# Additionally, also reexport the `mavlink_hal`, and `mavio` crates which are used by those macros.
mavlink = ["data-macros/mavlink", "dep:mavio", "dep:mavlink-hal"]
# Reexport all PSS related macros from the `data_macros` crate.
# Additionally, also reexport the `datapoint-information` crate which is used by those macros.
pss = ["data-macros/pss", "datapoint-information"]
std = ["bincode?/std"]

[lints]
workspace = true
