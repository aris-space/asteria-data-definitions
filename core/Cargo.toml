[package]
name = "data-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", optional = true, default-features = false }
can-hal = { path = "../can-hal", version = "0.1.0", optional = true }
data-macros = { path = "../macros", version = "0.1.0" }

[features]
default = []
std = ["bincode/std"]
bincode = ["dep:bincode"]
# Reexport all CAN related macros from the `data_macros` crate.
# Additionally, also reexport the `can_hal` and `bincode` crates which are used by those macros.
can = ["bincode", "data-macros/can", "dep:can-hal"]


[lints]
workspace = true
