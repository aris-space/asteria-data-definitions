[package]
name = "hermes-can"
version = "0.3.2"
edition = "2024"
authors = ["Louis Schell <louis.schell1@gmx.de>"]
publish = false

[lib]
doctest = false

[dependencies]
embedded-can = { version = "0.4.1" }
serde = { version = "1.0.218", features = [
    "derive",
], default-features = false, optional = true }
bincode = { version = "2.0.0-rc.3", features = [
    "derive",
    "serde",
], default-features = false }
thiserror = { version = "2.0.11", default-features = false }
defmt = { version = "0.3.10", optional = true }
arbitrary = { version = "1.4.1", features = ["derive"], optional = true }
hermes-can-derive = { path = "hermes-can-derive" }
const_panic = { version = "0.2.12", features = ["rust_1_82"] }

[lints.clippy]
unwrap_used = "deny"
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"  # Too many false positives for acronymes I can't bother to whitelist

[[example]]
name = "usage"
required-features = ["std", "all"]

[package.metadata.cargo-all-features]
# This package metadata is used by `cargo build-all-features` to build with all subsets of features
# enabled. This would be intractable since we define a feature for each message, so we only allow
# the following features to be enabled.
allowlist = ["all", "std", "serde", "arbitrary", "defmt"]

[dev-dependencies]
# bincode std dependency is needed in tests.
hermes-can = { path = ".", features = ["std"] }

[features]
std = ["bincode/std"]
serde = ["dep:serde"]
arbitrary = ["dep:arbitrary", "std"]
defmt = ["dep:defmt"]


# --- Messages ---
# Enables all messages
all = [

    # --- Event Messages ---
    "message-separation-trigger",
    "message-deployment-trigger",
